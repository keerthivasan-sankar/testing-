name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: |
          pip install pyflakes
          python -m pyflakes cryptoflex/

      - name: Run tests (PQC disabled — fast matrix)
        env:
          CRYPTOFLEX_DISABLE_PQC: "1"
        run: pytest -v

  test-with-real-pqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies for liboqs (cmake, ninja, gcc, libssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libssl-dev

      - name: Install package with PQC extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pqc]"

      - name: Run full test suite
        run: pytest -v
